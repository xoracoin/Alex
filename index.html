<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bekhruz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02080e;--c:#17d1d1;--t:#b9c0c4;--btn:#e9e9e9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Noto Serif',Georgia,serif;color:var(--t)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:18%;background:linear-gradient(transparent,rgba(23,209,209,.07));pointer-events:none}
canvas#bg{position:fixed;inset:0;width:100%;height:100%}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12%}
.card{width:100%;max-width:340px;min-height:272px;padding:24px 18px 26px;border-radius:16px;background:rgba(2,10,16,.82);border:1px solid rgba(23,209,209,.14);box-shadow:0 0 28px rgba(23,209,209,.16),inset 0 0 22px rgba(23,209,209,.05);text-align:center;display:flex;flex-direction:column;align-items:center}
.ava{width:84px;height:84px;border-radius:50%;border:3px solid var(--c);object-fit:cover;box-shadow:0 0 14px rgba(23,209,209,.5)}
h1{margin-top:14px;font-size:27px;color:var(--c);font-weight:700;text-shadow:0 0 10px rgba(23,209,209,.35)}
.q{margin-top:12px;font-size:15px;line-height:1.45;min-height:44px;color:var(--t)}
.q i{display:inline-block;width:1px;height:1em;background:var(--c);vertical-align:-2px;margin-left:3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.tg{margin-top:auto;padding:7px 18px;border:1px solid var(--c);border-radius:20px;color:var(--c);text-decoration:none;font-size:14px;font-family:inherit;background:transparent;cursor:pointer}
.fl{position:fixed;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border:0;animation:fy 5s ease-in-out infinite;z-index:5;text-decoration:none;color:#111}
.fl img{width:100%;height:100%;object-fit:cover}
.fl.round{border-radius:50%;background:var(--btn);box-shadow:0 0 12px rgba(255,255,255,.35)}
.fl.sq{border-radius:7px;background:#000;border:1px solid #444}
.fl.bare{background:none}
.fl.txt{font-size:24px;font-weight:700;font-family:inherit}
@keyframes fy{50%{transform:translateY(-7px)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:20;padding:20px}
.modal.on{display:flex}
.box{position:relative;width:100%;max-width:330px;padding:22px 20px;border-radius:14px;background:#031017;border:1px solid rgba(23,209,209,.5);box-shadow:0 0 22px rgba(23,209,209,.2);color:#e8eef0;text-align:left}
.box h2{color:var(--c);font-size:20px;margin-bottom:14px;padding-right:30px}
.box ul{padding-left:20px;font-size:14.5px;line-height:1.55}.box li{margin-bottom:9px}
.x{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:1px solid var(--c);background:none;color:var(--c);font:12px sans-serif;cursor:pointer}
/* admin */
#adm .box{max-width:420px;max-height:88vh;overflow:auto;font-family:system-ui,sans-serif}
#adm label{display:block;font-size:12px;color:#8fb;margin:10px 0 3px}
#adm input[type=text],#adm input[type=password],#adm textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #1b4a4f;background:#010a0f;color:#fff;font:13px system-ui}
#adm textarea{min-height:70px}
#adm input[type=file]{font-size:12px;color:#aaa;margin-top:4px;width:100%}
#adm .it{border:1px solid #123;border-radius:10px;padding:8px;margin-top:10px}
#adm .it b{color:var(--c);font-size:13px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.b{flex:1;padding:9px;border-radius:8px;border:1px solid var(--c);background:none;color:var(--c);font:13px system-ui;cursor:pointer}
.b.p{background:var(--c);color:#012}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap"><div class="card">
  <img class="ava" id="ava" alt="">
  <h1 id="name"></h1>
  <p class="q"><span id="qt"></span><i></i></p>
  <a class="tg" id="tg" target="_blank" rel="noopener">Telegram</a>
</div></div>
<div id="fls"></div>

<div class="modal" id="rules"><div class="box"><button class="x" data-close>x</button><h2 id="rt"></h2><ul id="rl"></ul></div></div>

<div class="modal" id="adm"><div class="box">
  <button class="x" data-close>x</button><h2>Admin panel</h2>
  <label>Ism</label><input type="text" id="a_name">
  <label>Asosiy rasm (havola yoki fayl)</label><input type="text" id="a_ava"><input type="file" accept="image/*" id="a_avaf">
  <label>Telegram tugmasi matni</label><input type="text" id="a_tgt">
  <label>Telegram havolasi</label><input type="text" id="a_tg">
  <label>Iqtiboslar (har qatorda bittadan)</label><textarea id="a_q"></textarea>
  <label>Qoidalar sarlavhasi</label><input type="text" id="a_rt">
  <label>Qoidalar (har qatorda bittadan)</label><textarea id="a_rl"></textarea>
  <label style="font-size:14px;color:#17d1d1;margin-top:16px">Suzuvchi tugmalar</label>
  <div id="a_fl"></div>
  <label>Yangi parol</label><input type="password" id="a_pw" placeholder="bo'sh qoldirsangiz o'zgarmaydi">
  <div class="row"><button class="b p" id="save">Saqlash</button><button class="b" id="exp">Eksport</button><button class="b" id="imp">Import</button><button class="b" id="rst">Asliga qaytarish</button></div>
  <input type="file" id="impf" accept=".json" hidden>
</div></div>

<script>
const KEY='pixic_cfg_v1';
const DEF={
  pw:'admin123',
  name:'Bekhruz',
  ava:'https://i.imgur.com/placeholder.png',
  tgt:'Telegram', tg:'https://t.me/Mamasiddiqovv',
  quotes:['Einstein: Imagination is more important than knowledge.','Newton: If I have seen further, it is by standing on giants.','Curie: Nothing in life is to be feared, it is only to be understood.'],
  rt:"So'zlashuv qoidalari",
  rules:["Hurmat bilan yozing.","Spam va reklama yubormang.","Shaxsiy ma'lumotlarni so'ramang va tarqatmang.","Murojaatingizni qisqa va tushunarli yozing."],
  fl:[
    {img:'',txt:'',link:'',shape:'round',size:46,x:3,y:11,d:0},
    {img:'',txt:'★',link:'',shape:'bare',size:30,x:4,y:34,d:.6},
    {img:'',txt:'PIX UNITY',link:'https://t.me/Mamasiddiqovv',shape:'round',size:46,x:83,y:27,d:1.2},
    {img:'',txt:'PIX SIM',link:'https://t.me/Mamasiddiqovv',shape:'sq',size:46,x:83,y:47,d:.3},
    {img:'',txt:'🎧',link:'https://t.me/Mamasiddiqovv',shape:'round',size:46,x:2,y:66,d:.9},
    {img:'',txt:'!',link:'rules',shape:'round',size:46,x:83,y:79,d:1.6}
  ]
};
let cfg;
try{cfg=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){cfg=JSON.parse(JSON.stringify(DEF))}
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){alert('Saqlab bo\'lmadi (rasm hajmi katta bo\'lishi mumkin)')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  document.title=cfg.name;
  $('#name').textContent=cfg.name;
  $('#ava').src=cfg.ava;
  const tg=$('#tg');tg.textContent=cfg.tgt;tg.href=cfg.tg;
  $('#rt').textContent=cfg.rt;
  $('#rl').innerHTML=cfg.rules.map(r=>'<li>'+esc(r)+'</li>').join('');
  $('#fls').innerHTML=cfg.fl.map((f,i)=>{
    const inner=f.img?`<img src="${esc(f.img)}" alt="">`:`<span class="${f.txt==='!'?'txt':''}" style="font-size:${f.txt&&f.txt.length>3?9:f.txt==='!'?26:22}px;font-weight:700;text-align:center;line-height:1.1;color:${f.shape==='sq'?'#4ab':'#222'}">${esc(f.txt||'')}</span>`;
    const st=`width:${f.size}px;height:${f.size}px;left:${f.x}%;top:${f.y}%;animation-delay:${f.d}s`;
    const cls=`fl ${f.shape}`;
    return f.link&&f.link!=='rules'
      ?`<a class="${cls}" style="${st}" href="${esc(f.link)}" target="_blank" rel="noopener">${inner}</a>`
      :`<button class="${cls}" style="${st}" data-i="${i}">${inner}</button>`;
  }).join('');
}
render();

/* typewriter */
let qi=0;
async function type(){
  const el=$('#qt');
  for(;;){
    const t=cfg.quotes.length?cfg.quotes[qi++%cfg.quotes.length]:'';
    el.textContent='';
    for(const ch of t){el.textContent+=ch;await new Promise(r=>setTimeout(r,60))}
    await new Promise(r=>setTimeout(r,2600));
  }
}
type();

/* confetti */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,P=[];
const COL=['#e0245e','#2ecc40','#3b5bdb','#17d1d1','#f1c40f','#9b27d6','#ff6b00'];
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',rs);rs();
const mk=(y)=>({x:Math.random()*W,y:y??Math.random()*H,s:(2+Math.random()*9)*devicePixelRatio,v:(.25+Math.random()*.7)*devicePixelRatio,dx:(Math.random()-.5)*.4*devicePixelRatio,r:Math.random()*6,dr:(Math.random()-.5)*.03,c:COL[Math.random()*COL.length|0],a:.35+Math.random()*.6});
for(let i=0;i<70;i++)P.push(mk());
(function loop(){
  cx.clearRect(0,0,W,H);
  for(const p of P){
    p.y+=p.v;p.x+=p.dx;p.r+=p.dr;
    if(p.y>H+20)Object.assign(p,mk(-20));
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=8;
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();
  }
  requestAnimationFrame(loop);
})();

/* modals */
const open=id=>$(id).classList.add('on');
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')||e.target.classList.contains('modal'))e.target.closest('.modal').classList.remove('on');
  const b=e.target.closest('button.fl');
  if(b&&cfg.fl[b.dataset.i].link==='rules'||b&&!cfg.fl[b.dataset.i].link)open('#rules');
});

/* admin: nomni 5 marta bosing yoki #admin */
let n=0,tm;
$('#name').addEventListener('click',()=>{n++;clearTimeout(tm);tm=setTimeout(()=>n=0,1500);if(n>=5){n=0;askAdmin()}});
if(location.hash==='#admin')setTimeout(askAdmin,300);
function askAdmin(){const p=prompt('Parol:');if(p===null)return;if(p!==cfg.pw)return alert('Noto\'g\'ri parol');fill();open('#adm')}

function readFile(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function fill(){
  $('#a_name').value=cfg.name;$('#a_ava').value=cfg.ava.startsWith('data:')?'(yuklangan fayl)':cfg.ava;
  $('#a_tgt').value=cfg.tgt;$('#a_tg').value=cfg.tg;
  $('#a_q').value=cfg.quotes.join('\n');$('#a_rt').value=cfg.rt;$('#a_rl').value=cfg.rules.join('\n');
  $('#a_fl').innerHTML=cfg.fl.map((f,i)=>`<div class="it"><b>Tugma ${i+1}</b>
   <label>Rasm havolasi (bo'sh = matn)</label><input type="text" data-k="img" data-i="${i}" value="${f.img.startsWith('data:')?'(yuklangan fayl)':esc(f.img)}">
   <input type="file" accept="image/*" data-f="${i}">
   <label>Matn / belgi</label><input type="text" data-k="txt" data-i="${i}" value="${esc(f.txt)}">
   <label>Havola ("rules" = qoidalar oynasi)</label><input type="text" data-k="link" data-i="${i}" value="${esc(f.link)}">
   <label>X % / Y % / o'lcham px</label>
   <div style="display:flex;gap:6px"><input type="text" data-k="x" data-i="${i}" value="${f.x}"><input type="text" data-k="y" data-i="${i}" value="${f.y}"><input type="text" data-k="size" data-i="${i}" value="${f.size}"></div></div>`).join('');
  $('#a_fl').querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=()=>readFile(inp.files[0],d=>{cfg.fl[inp.dataset.f].img=d;inp.previousElementSibling.previousElementSibling.value='(yuklangan fayl)'}));
}
$('#a_avaf').onchange=e=>readFile(e.target.files[0],d=>{cfg.ava=d;$('#a_ava').value='(yuklangan fayl)'});
$('#save').onclick=()=>{
  cfg.name=$('#a_name').value;
  const a=$('#a_ava').value;if(a!=='(yuklangan fayl)')cfg.ava=a;
  cfg.tgt=$('#a_tgt').value;cfg.tg=$('#a_tg').value;
  cfg.quotes=$('#a_q').value.split('\n').map(s=>s.trim()).filter(Boolean);
  cfg.rt=$('#a_rt').value;cfg.rules=$('#a_rl').value.split('\n').map(s=>s.trim()).filter(Boolean);
  document.querySelectorAll('#a_fl [data-k]').forEach(el=>{
    const f=cfg.fl[el.dataset.i],k=el.dataset.k,v=el.value;
    if(k==='img'){if(v!=='(yuklangan fayl)')f.img=v}
    else if(['x','y','size'].includes(k))f[k]=parseFloat(v)||0;
    else f[k]=v;
  });
  if($('#a_pw').value)cfg.pw=$('#a_pw').value;
  save();render();$('#adm').classList.remove('on');
};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(cfg));a.download='sayt-sozlamalari.json';a.click()};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{const r=new FileReader();r.onload=()=>{try{cfg=Object.assign({},DEF,JSON.parse(r.result));save();render();fill()}catch(x){alert('Fayl noto\'g\'ri')}};r.readAsText(e.target.files[0])};
$('#rst').onclick=()=>{if(confirm('Hammasi asl holatiga qaytadi?')){localStorage.removeItem(KEY);cfg=JSON.parse(JSON.stringify(DEF));render();fill()}};
</script>
</body>
</html>
